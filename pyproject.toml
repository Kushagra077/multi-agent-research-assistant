[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "langchain-groq>=1.1.3",
    "langchain-mistralai",
    "langchain-tavily>=0.2.18",
    "langchain[google-genai]>=1.4.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.9",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research_assistant"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
