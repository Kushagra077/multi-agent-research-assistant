name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Python 3.14 comes from .python-version; uv installs it.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests

      # No API keys are set on purpose: the tests fake every network call, and
      # tests/conftest.py makes a stray Jev or LLM call fail instead of going out.
      - name: Tests
        run: uv run pytest -q
